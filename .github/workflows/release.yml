name: PocketCam Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: PocketCam v1.1.0
          body: |
            PocketCam Android 1.1.0

            - Redesigned the Android camera control interface with a dark technology style.
            - Added live viewer roster and per-viewer WebRTC connection status (up to four viewers).
            - Added front/back camera switching while the stream is active.
            - Added live capture-frame and connection summaries.
            - Keeps the Android foreground-service notification visible during streaming.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
