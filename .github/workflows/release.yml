name: PocketCam Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: PocketCam v1.1.0
          body: |
            PocketCam Android 1.0.7

            - Explicitly configures Android WebRTC video encoder and decoder factories.
            - Adds local video frame counters to distinguish capture from transport issues.
            - Logs negotiated video direction and codec information for each viewer.
            - Keeps password-free camera startup and up to four password-protected viewers.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
