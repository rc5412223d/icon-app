name: PocketCam Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: PocketCam v1.0.1
          body: |
            PocketCam Android 1.0.1

            - Android camera streaming app
            - WebRTC video/audio with Cloudflare Worker signaling
            - Improved signaling keepalive (WebSocket ping every 15 seconds)
            - Improved connection failure diagnostics
            - Android debug APK for testing
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
